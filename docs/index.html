<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wschody i zachody słońca</title>
    <script type="module" crossorigin src="./assets/index-CR22wWvM.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-3UfvSjGg.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      const sourceHtmlMode = 'built';
      const rawSourceMarker = ['%', 'VITE_SOURCE_HTML_MODE', '%'].join('');
      const isRawSourceHtml = sourceHtmlMode === rawSourceMarker;
      const isGitHubPagesHost =
        window.location.hostname === 'github.io' ||
        window.location.hostname.endsWith('.github.io');
      const isDocsPath = /\/docs(?:\/|$)/.test(window.location.pathname);

      if (isRawSourceHtml && isGitHubPagesHost && !isDocsPath) {
        const currentUrl = new URL(window.location.href);

        if (!currentUrl.pathname.endsWith('/')) {
          currentUrl.pathname = `${currentUrl.pathname}/`;
        }

        const docsUrl = new URL('docs/', currentUrl);
        docsUrl.search = currentUrl.search;
        docsUrl.hash = currentUrl.hash;
        window.location.replace(docsUrl);
      }
    </script>
  </body>
</html>
